services:
  webproxy:
    image: 3proxy/3proxy:latest
    container_name: webproxy
    restart: always
    ports:
      - "${PROXY_PORT:-18443}:${PROXY_PORT:-18443}"
    volumes:
      - ./3proxy.cfg:/etc/3proxy/3proxy.cfg:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
