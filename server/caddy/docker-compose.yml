services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    # host-режим: Caddy должен достучаться до панели на 127.0.0.1:3000
    # и слушать 80 (ACME) + PANEL_HTTPS_PORT.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # bind-mount, а не именованный том: sync-certs.sh должен читать
      # выписанные сертификаты с хоста по предсказуемому пути
      - ./data:/data
      - ./config:/config
      - ./logs:/var/log/caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
